# QA Smoke L4: revisa la tienda PUBLICADA una vez al dia (12:00 UTC).
# Si algo falla, abre (o comenta) un issue con etiqueta qa-smoke y el log;
# si vuelve a estar sana, cierra el issue con comentario de recuperacion.
# Tambien se puede correr a mano: Actions -> "QA smoke de produccion" -> Run.
name: QA smoke de produccion

on:
  schedule:
    - cron: "0 12 * * *" # 07:00 Colombia
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # LTS vigente (Node 20 llego a EOL en abr-2026)
      - name: Smoke L4 contra produccion
        run: node qa_smoke_produccion.js

      - name: Abrir o actualizar issue si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Si el runner corto el proceso (timeout/OOM) el archivo no existe:
            // la alerta igual se abre, con nota de que no hay detalle.
            const log = fs.existsSync('smoke_resultado.txt')
              ? fs.readFileSync('smoke_resultado.txt', 'utf8').slice(-3000)
              : '(sin smoke_resultado.txt: el proceso murio antes de escribirlo)';
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'qa-smoke', per_page: 1});
            const cuerpo = '### 🔴 Smoke L4 de producción falló\n'
              + 'Corrida: ' + new Date().toISOString() + ' ([log completo]('
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '))\n\n```\n' + log + '\n```';
            if (abiertas.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: abiertas[0].number, body: cuerpo});
            } else {
              await github.rest.issues.create({...context.repo, title: '🔴 Producción: smoke QA falló', labels: ['qa-smoke'], body: cuerpo});
            }

      - name: Cerrar el issue si se recuperó
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const {data: abiertas} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'qa-smoke', per_page: 100});
            for (const i of abiertas) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number,
                body: '✅ Smoke L4 recuperado en ' + new Date().toISOString() + ' — cierro.'});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }
